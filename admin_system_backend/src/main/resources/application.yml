server:
  port: 8080

spring:
  application:
    name: admin-system-backend

  # P1-3：Nacos 配置中心（optional: 前缀 = Nacos 不可达/无配置时用本地默认值启动）
  # dataId=admin-system-backend.yaml, group=DEFAULT_GROUP；Nacos 控制台可热更新 jwt / rocketmq 配置
  config:
    import:
      - optional:nacos:admin-system-backend.yaml?group=DEFAULT_GROUP

  datasource:
    url: jdbc:mysql://127.0.0.1:3306/admin_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    # H-4: 显式声明隔离级别为 REPEATABLE READ（MySQL 默认值）
    # 与 Redisson 分布式锁 + FOR UPDATE 行锁双重悲观锁叠加，幻读可接受
    hikari:
      transaction-isolation: TRANSACTION_REPEATABLE_READ

  # Redisson 分布式锁自动装配读取此配置；单机 Redis 足够
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # password:             # 无密码留空
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # Nacos 服务注册发现（多实例注册同一 service name 形成集群）
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        service: ${spring.application.name}
        # 单机 Nacos 用 false；集群 Nacos 用 true
        ephemeral: true
      # P1-3：配置中心地址（与 discovery 同地址；spring.config.import 读取此处）
      config:
        server-addr: 127.0.0.1:8848

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# jwt自定义配置（P1-3：以下为本地默认值，Nacos dataId=admin-system-backend.yaml 可覆盖并热刷新）
jwt:
  secret: abcdefghijklmnopqabcdefghijklmnopq123456
  expiration: 7200000      # 2小时，单位毫秒

# RocketMQ 异步通知（可选：不配 name-server 时 BookingNotificationProducer 不加载）
# P1-3：Nacos 可覆盖 name-server；注意 @ConditionalOnProperty 是启动时判断，改 name-server 需重启
rocketmq:
  producer:
    group: booking-producer-group
#  name-server: 127.0.0.1:9876    # ← 取消注释并填地址以启用 MQ

# 主线2：过期待审批预约自动取消（冲突校验 SQL 已做懒失效，本任务负责状态落库）
booking:
  expire:
    enabled: true
    cron: "0 0/5 * * * ?"

# Redisson 分布式锁日志级别（可选，生产可调到 INFO）
logging:
  level:
    org.redisson: INFO
